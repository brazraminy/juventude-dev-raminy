<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
</head>

<body>
    <h1>Cadastro</h1>

    <form action="#" method="post">
        <label for="nome" class="form-label">Nome:</label>
        <input type="text" id="nome" name="nome" class="form-control" required>

        <br><br>

        <label for="email" class="form-label">E-mail:</label>
        <input type="email" id="email" name="email" class="form-control" required>

        <br><br>

        <label for="senha" class="form-label">Senha:</label>
        <input type="password" id="senha" name="senha" class="form-control" required>

        <br><br>

        <label for="idade" class="form-label">Idade:</label>
        <input type="number" id="idade" name="idade" class="form-control" min="1" required>

        <br><br>

    <select class="ano escolar" aria-label=".ano escolar">
        <option selected>ano escolar</option>
        <option value="maca">1° ano</option>
        <option value="banana">2° ano</option>
        <option value="laranja">3° ano</option>
    </select>

    <br></br>
    
    <button type="submit" class="btn btn-primary">Enviar </button>
    </form>

</body>

</html>
